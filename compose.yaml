# One container serves every estate. Which estates exist is the app's business
# (instance/estates.json, managed from the sidebar dropdown); this file only
# knows the site: one port, one login, one data folder.
#
#   docker compose --env-file datasets/site.env up -d
#
# or, from the Makefile:  make up
#
# datasets/site.env is required rather than defaulted: without it the stack has
# no password and no signing key, and should not start.
services:
  web:
    build: .
    # The image builds its own non-root user (uid 999), but both mounts below
    # are host directories owned by whoever runs the stack. On Linux a bind
    # mount keeps the host's ownership, so a container running as 999 cannot
    # create its own SQLite file — the app starts, serves /login, and dies the
    # moment it touches the database. Run as the owning host user instead:
    # still non-root, and every file written stays readable, editable and
    # backup-able by the person who owns the directory.
    user: "${PUID:-1000}:${PGID:-1000}"
    container_name: ${CONTAINER_NAME:-open_estate}
    restart: unless-stopped
    # Loopback by default. A container that publishes 0.0.0.0 is reachable by
    # anything that can route to the host, and on a flat network with no
    # firewall the bind address IS the access control. A host that genuinely
    # wants the app on its LAN has to say so, in one place, on purpose.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-5000}:5000"
    volumes:
      # Mount the current directory (.) to /app inside the container
      - .:/app
      # Every estate's database lives under instance/estates/<slug>/, with the
      # registry beside it in instance/estates.json. See datasets/README.md.
      - ./instance:/app/instance
    env_file:
      - datasets/site.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
