# One container per dataset. Everything that differs between datasets lives in
# datasets/<name>.env, which is both the file Compose interpolates and the file
# the container reads its environment from:
#
#   docker compose --env-file datasets/demo.env up -d
#
# or, from the Makefile:  make up DATASET=demo
#
# DATASET is deliberately required rather than defaulted: a typo should stop the
# stack, not quietly start the wrong estate.
services:
  web:
    build: .
    container_name: estate_${DATASET:?DATASET is not set - run "make up DATASET=<name>". Upgrading an install that predates datasets? Run "make adopt DATASET=<name>" once, then retry. See datasets/README.md}
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # Mount the current directory (.) to /app inside the container
      - .:/app
      # Each dataset keeps its database in its own host directory. The path
      # inside the container is identical for every dataset, so DATABASE_URL
      # is the same everywhere and only this mount decides which estate loads.
      - ./instance/${DATASET:?DATASET is not set - run "make up DATASET=<name>". Upgrading an install that predates datasets? Run "make adopt DATASET=<name>" once, then retry. See datasets/README.md}:/app/instance
    env_file:
      - datasets/${DATASET:?DATASET is not set - run "make up DATASET=<name>". Upgrading an install that predates datasets? Run "make adopt DATASET=<name>" once, then retry. See datasets/README.md}.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
