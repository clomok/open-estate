<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b2f6e">
    <title>Open Estate · Sign in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-card">
        <span class="brand-mark">Open Estate</span>
        <h1 class="brand-name">The Binder</h1>
        <div class="brand-rule" aria-hidden="true"></div>
        <p>Everything the family will need, in one place, ready when the time comes.</p>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="error">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        <form method="post">
            <input type="password" name="password" placeholder="Password" aria-label="Password" required autofocus>
            <button type="submit" class="btn-primary">Open the binder</button>
        </form>
        <div class="login-foot">Private · Self-hosted · Offline-first</div>
    </div>
</body>
</html>
